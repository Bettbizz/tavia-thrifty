# Bizzfy POS — applies new database updates and deploys the notification
# function to Supabase whenever they change on the main branch.
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        Supabase → Connect → Session pooler connection string (with your DB password)
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens → Generate new token
#   VAPID_PRIVATE_KEY      the private notification key (given to you once)
name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths: ['migrations/**', 'supabase/functions/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

concurrency: deploy-supabase

env:
  PROJECT_REF: hcryrmtojabvghoxaloe
  APP_URL: https://tavia-thrifty.brianbeth8851-b1e.workers.dev

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply new database updates (each file once, in order)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -eo pipefail
          if [ -z "$DB_URL" ]; then echo "::warning::SUPABASE_DB_URL secret is not set yet; skipping"; exit 0; fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "create table if not exists public.app_migrations (name text primary key, applied_at timestamptz not null default now()); alter table public.app_migrations enable row level security;"
          for f in $(ls migrations/*.sql | sort); do
            name=$(basename "$f")
            if [ "$(psql "$DB_URL" -tA -c "select 1 from public.app_migrations where name = '$name'")" = "1" ]; then
              echo "already applied: $name"; continue
            fi
            echo "applying: $name"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q --single-transaction -f "$f" \
              -c "insert into public.app_migrations (name) values ('$name') on conflict (name) do nothing"
          done

  functions:
    runs-on: ubuntu-latest
    needs: database
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy notification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then echo "::warning::Supabase access token or VAPID key not set yet; skipping"; exit 0; fi
          VAPID_PUBLIC_KEY=$(sed -n "s/^export const VAPID_PUBLIC_KEY = '\(.*\)';/\1/p" config.js)
          supabase secrets set --project-ref "$PROJECT_REF" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" VAPID_SUBJECT="$APP_URL"
          # The function checks the caller's login itself.
          supabase functions deploy notify-owners --project-ref "$PROJECT_REF" --no-verify-jwt
